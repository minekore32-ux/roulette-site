<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ルーレット</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>ルーレット</h1>
<div id="adminArea">
    <div id="authArea">
        <form id="loginForm">
            <input id="email" type="email" placeholder="管理者メール" required>
            <input id="password" type="text" placeholder="パスワード" required>
            <button type="submit">ログイン</button>
        </form>
    </div>
    <div id="adminControls" style="display:none; margin-top:10px;">
        <button id="adminButton">⚙ 管理画面を開く</button>
        <button id="signout" type="button">ログアウト</button>
    </div>
    <div id="authStatus" style="margin-top:8px; color:#333;"></div>
</div>
<div id="roulette-container">
</div>

<button id="addRoulette">＋ルーレット追加</button>
<button id="spinButton">一斉に決定</button>
<div id="adminPanel" style="display:none; margin-top:30px;">
    <h2>管理画面</h2>

    <button id="addRouletteAdmin">
        ＋ルーレット追加
    </button>

    <div id="adminList"></div>
</div>
<div id="editPanel" style="display:none; margin-top:20px;">
    <h2 id="editTitle">編集</h2>
<button id="backAdmin">
    ← 管理画面に戻る
</button>

    <div id="itemList"></div>

    <label for="editName">ルーレット名</label>
    <input id="editName" type="text" placeholder="ルーレット名" style="width:100%; margin-bottom:10px;">

    <input
        type="text"
        id="newItem"
        placeholder="新しい項目">

    <button id="addItemButton">
        ＋追加
    </button>

    <br><br>

    <button id="saveButton">
        保存
    </button>

    <button id="closeButton">
        閉じる
    </button>
</div>
<script type="module">
    import { initFirebase } from './firebase.js';
    import { appInit } from './app.js';
    await initFirebase();
    await appInit();
    import('./admin-module.js');
</script>

</body>
</html>
